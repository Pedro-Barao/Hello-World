<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <h1>Formulário</h1>

    <!-- Formulário -->
    <form>

        <!-- Legenda -->
        <label for = "campo_nome">
            Nome:
        </label>
        <!-- For direciona para o Id -->

        <!-- Entrada de Dados (Type = tipo do dado, Placeholder = texto curto que será apagado)-->
        <input id = "campo_nome" type = "text" placeholder = "Digite seu nome">
        <!-- Id sevem para ajudar a localizar os campos por identificadores -->

    </form>

</body>
</html>
